name: Spotify credentials check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Spotify client credentials and metadata access
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          if [ -z "$SPOTIFY_CLIENT_ID" ] || [ -z "$SPOTIFY_CLIENT_SECRET" ]; then
            echo "::error::SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET repository secrets are not set"
            exit 1
          fi
          TOKEN_JSON=$(curl -sS -X POST https://accounts.spotify.com/api/token \
            -u "$SPOTIFY_CLIENT_ID:$SPOTIFY_CLIENT_SECRET" \
            -d grant_type=client_credentials)
          TOKEN=$(echo "$TOKEN_JSON" | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::Auth failed: $(echo "$TOKEN_JSON" | jq -r '.error_description // .error // "unknown error"')"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "Auth OK"
          TRACK_CODE=$(curl -sS -o track.json -w "%{http_code}" -H "Authorization: Bearer $TOKEN" https://api.spotify.com/v1/tracks/11dFghVXANMlKmJXsNCbNl)
          echo "Track endpoint HTTP status: $TRACK_CODE"
          if [ "$TRACK_CODE" != "200" ]; then
            echo "::error::Track lookup failed. Response start: $(head -c 300 track.json | tr '\n' ' ')"
            exit 1
          fi
          echo "Track lookup OK: $(jq -r '[.artists[].name] | join(", ")' track.json) - $(jq -r '.name' track.json)"
          PL=$(curl -sS -o playlist.json -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "https://api.spotify.com/v1/playlists/37i9dQZF1DXcBWIGoYBM5M/tracks?limit=1")
          echo "Playlist endpoint HTTP status: $PL"
          if [ "$PL" != "200" ]; then echo "Playlist response start: $(head -c 300 playlist.json | tr '\n' ' ')"; fi
