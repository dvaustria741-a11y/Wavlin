name: Spotify link check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public Spotify embed data
        run: |
          python3 - <<'PY'
          import re, json, sys, io, urllib.request, urllib.error
          buf = io.StringIO()
          real_stdout = sys.stdout
          sys.stdout = buf
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept-Language": "en"})
              try:
                  r = urllib.request.urlopen(req, timeout=20)
                  return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")
              except Exception as e:
                  return -1, str(e)

          def find(obj, key):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      if k == key:
                          yield v
                      yield from find(v, key)
              elif isinstance(obj, list):
                  for v in obj:
                      yield from find(v, key)

          def nextdata(html):
              m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', html, re.S)
              try:
                  return json.loads(m.group(1)) if m else None
              except Exception:
                  return None

          def brief(v, n=70):
              return {k: str(x)[:n] for k, x in v.items()} if isinstance(v, dict) else str(v)[:n]

          cases = [
              ("track", "11dFghVXANMlKmJXsNCbNl"),
              ("playlist PUBLIC editorial", "37i9dQZF1DXcBWIGoYBM5M"),
              ("playlist USER", "3Y3iJbD6oNueV1gmzA5dck"),
              ("album", "4yP0hdKOZPNshxUOjY0cZj"),
          ]
          for label, id_ in cases:
              kind = label.split()[0]
              s, h = get(f"https://open.spotify.com/embed/{kind}/{id_}")
              nd = nextdata(h)
              print(f"### {label} embed status={s} len={len(h)} next_data={'yes' if nd else 'no'}")
              if not nd:
                  print(h[:200].replace("\n", " "))
                  continue
              ents = list(find(nd, "entity"))
              if ents and isinstance(ents[0], dict):
                  e = ents[0]
                  print("entity keys:", sorted(e.keys()))
                  print("entity brief:", json.dumps({k: brief(v, 60) for k, v in e.items() if k != "trackList"}, ensure_ascii=False)[:700])
                  tl = e.get("trackList")
                  if isinstance(tl, list):
                      print("trackList count:", len(tl))
                      for item in tl[:3]:
                          print(json.dumps(brief(item), ensure_ascii=False))
              else:
                  err = list(find(nd, "error")) + list(find(nd, "status"))
                  print("no entity; error/status:", json.dumps(err[:3], ensure_ascii=False)[:300])
          sys.stdout = real_stdout
          msg = buf.getvalue()
          print(msg)
          print("::notice title=probe::" + msg.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
