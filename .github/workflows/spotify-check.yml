name: Spotify link check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check public oEmbed and page metadata for a track
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          TRACK_URL="https://open.spotify.com/track/11dFghVXANMlKmJXsNCbNl"
          echo "--- oEmbed ---"
          CODE=$(curl -sS -A "$UA" -o oembed.json -w "%{http_code}" "https://open.spotify.com/oembed?url=$TRACK_URL")
          echo "HTTP $CODE"
          jq -c '{title, author_name}' oembed.json 2>/dev/null || head -c 300 oembed.json
          echo
          echo "--- Page Open Graph tags ---"
          CODE=$(curl -sS -L -A "$UA" -o page.html -w "%{http_code}" "$TRACK_URL")
          echo "HTTP $CODE"
          grep -o '<meta[^>]*property="og:\(title\|description\)"[^>]*>' page.html | head -4 || echo "no og tags found"
