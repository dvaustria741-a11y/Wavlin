name: Spotify link check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public Spotify pages
        run: |
          python3 - <<'PY'
          import re, json, urllib.request, urllib.error
          UA_DESK = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          UA_BOT = "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)"
          TRACK = "11dFghVXANMlKmJXsNCbNl"
          PLAYLIST = "3Y3iJbD6oNueV1gmzA5dck"

          def get(url, ua):
              req = urllib.request.Request(url, headers={"User-Agent": ua, "Accept-Language": "en"})
              try:
                  r = urllib.request.urlopen(req, timeout=20)
                  return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")
              except Exception as e:
                  return -1, str(e)

          def og(html):
              out = {}
              for m in re.finditer(r"<meta[^>]+>", html):
                  t = m.group(0)
                  p = re.search(r'(?:property|name)=["\']([^"\']+)["\']', t)
                  c = re.search(r'content=["\']([^"\']*)["\']', t)
                  if p and c and (p.group(1).startswith("og:") or p.group(1) == "description"):
                      out[p.group(1)] = c.group(1)[:140]
              return out

          def find(obj, key):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      if k == key:
                          yield v
                      yield from find(v, key)
              elif isinstance(obj, list):
                  for v in obj:
                      yield from find(v, key)

          def nextdata(html):
              m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', html, re.S)
              try:
                  return json.loads(m.group(1)) if m else None
              except Exception as e:
                  return None

          def show(label, data):
              print("### " + label)
              print(json.dumps(data, ensure_ascii=False)[:1500])

          for kind, id_ in (("track", TRACK), ("playlist", PLAYLIST)):
              url = f"https://open.spotify.com/{kind}/{id_}"
              for name, ua in (("desktop", UA_DESK), ("bot", UA_BOT)):
                  s, h = get(url, ua)
                  show(f"{kind} page [{name} UA] status={s} len={len(h)}", og(h))
              s, h = get(f"https://open.spotify.com/oembed?url={url}", UA_DESK)
              show(f"{kind} oembed status={s}", h[:400])
              s, h = get(f"https://open.spotify.com/embed/{kind}/{id_}", UA_DESK)
              nd = nextdata(h)
              print(f"### {kind} embed status={s} len={len(h)} next_data={'yes' if nd else 'no'}")
              if nd:
                  for key in ("trackList", "artists", "subtitle"):
                      vals = list(find(nd, key))
                      if vals:
                          v = vals[0]
                          if key == "trackList" and isinstance(v, list):
                              print(f"trackList count={len(v)}")
                              for item in v[:3]:
                                  print(json.dumps({k: str(x)[:70] for k, x in item.items()}, ensure_ascii=False))
                          else:
                              print(f"{key}: {json.dumps(v, ensure_ascii=False)[:300]}")
                      else:
                          print(f"{key}: not found")
              else:
                  print(h[:300].replace("\n", " "))
          PY
