name: Spotify link check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe popularity-ranked search sources
        run: |
          python3 - <<'PY'
          import json, sys, io, urllib.request, urllib.parse
          buf = io.StringIO()
          real_stdout = sys.stdout
          sys.stdout = buf
          def get(url):
              try:
                  return json.loads(urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=20).read().decode())
              except Exception as e:
                  return {"error": str(e)}
          for q in ["one time", "one time justin bieber", "blinding lights", "cardigan"]:
              d = get("https://api.deezer.com/search/track?limit=6&q=" + urllib.parse.quote(q))
              print("### deezer:", q)
              for t in d.get("data", [])[:6]:
                  print(f'{t["title"]} | {t["artist"]["name"]} | {t["duration"]}s | rank {t["rank"]}')
              if "error" in d: print(d)
          sys.stdout = real_stdout
          msg = buf.getvalue()
          print(msg)
          print("::notice title=probe::" + msg.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
