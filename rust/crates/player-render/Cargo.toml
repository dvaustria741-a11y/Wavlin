[package]
name = "wavlin-player-render"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "wgpu port of the Wavlin player background (Blur and Gradient styles) feeding the glass renderer"

[dependencies]
wgpu = "22"
bytemuck = { version = "1.14", features = ["derive"] }
thiserror = { workspace = true }
wavlin-ui-style = { path = "../ui-style" }
wavlin-glass-render = { path = "../glass-render" }

[dev-dependencies]
naga = { version = "22", features = ["wgsl-in"] }
pollster = "0.3"
